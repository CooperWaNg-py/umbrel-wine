# The single app port (8080). /desktop/ -> Selkies (:3000, SUBFOLDER=/desktop/),
# everything else -> the launcher (127.0.0.1:8090).
server {
  # IPv4 only, so nginx never fails on hosts with IPv6 disabled.
  listen 8080;
  # Relative redirects keep the browser on https behind the Umbrel proxy.
  absolute_redirect off;
  client_max_body_size 0;

  location = /desktop {
    return 301 /desktop/;
  }

  # Mirrors the base's `location SUBFOLDERapi` header/timeout set. No URI on
  # proxy_pass, so the /desktop/ prefix reaches Selkies' SUBFOLDER locations
  # (including /desktop/api) unchanged.
  location /desktop/ {
    proxy_http_version      1.1;
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_set_header        Host $host;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_pass              http://127.0.0.1:3000;
  }

  # Unbuffered so multi-GB uploads stream straight to the launcher and the
  # upload progress bar is accurate.
  location / {
    proxy_http_version      1.1;
    proxy_request_buffering off;
    proxy_buffering         off;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_pass              http://127.0.0.1:8090;
  }
}
