# The single app port (8080). /desktop/ -> Selkies (:3000, SUBFOLDER=/desktop/),
# everything else -> the launcher (127.0.0.1:8090).

# Cross-origin request gate. Umbrel's login cookie is SameSite=Lax and not
# port-scoped, so pages served by ANY other app on the same host (a different
# port is still "same-site") send it along, and neither the Umbrel gateway nor
# Selkies (SELKIES_ALLOWED_ORIGINS="*") checks where a request came from. Such
# a page could reset drives or open the desktop WebSocket and type commands.
#
# Browsers attach Sec-Fetch-Site to every request and pages cannot forge it.
# Anything that can change state -- every method but GET/HEAD, and every
# WebSocket upgrade -- must come from this origin ("same-origin"), from the
# user directly ("none"), or from a non-browser client (header absent).
# Plain GETs stay open so the dashboard can link here; other origins cannot
# read the responses without CORS, which is never granted.
map $http_sec_fetch_site $umbrel_wine_foreign {
  default      1;
  ""           0;
  same-origin  0;
  none         0;
}
map "$request_method:$http_upgrade" $umbrel_wine_unsafe {
  default      1;
  "GET:"       0;
  "HEAD:"      0;
}

server {
  # IPv4 only, so nginx never fails on hosts with IPv6 disabled.
  listen 8080;
  # Relative redirects keep the browser on https behind the Umbrel proxy.
  absolute_redirect off;
  client_max_body_size 0;

  set $umbrel_wine_blocked "$umbrel_wine_foreign$umbrel_wine_unsafe";
  if ($umbrel_wine_blocked = "11") {
    return 403;
  }

  location = /desktop {
    return 301 /desktop/;
  }

  # Mirrors the base's `location SUBFOLDERapi` header/timeout set. No URI on
  # proxy_pass, so the /desktop/ prefix reaches Selkies' SUBFOLDER locations
  # (including /desktop/api) unchanged.
  location /desktop/ {
    proxy_http_version      1.1;
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_set_header        Host $host;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_pass              http://127.0.0.1:3000;
  }

  # Unbuffered so multi-GB uploads stream straight to the launcher and the
  # upload progress bar is accurate.
  location / {
    proxy_http_version      1.1;
    proxy_request_buffering off;
    proxy_buffering         off;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_pass              http://127.0.0.1:8090;
  }
}
