# umbrelOS 2.0 only: the Selkies stream decodes with WebCodecs, which browsers
# enable only in a secure context. umbrelOS 2.0 serves every app port over both
# http and https, and `requiresHttps` makes the dashboard open the https one.
# umbreld accepts the app when semver.gte(<os version>, manifestVersion).
manifestVersion: "2.0.0"
# `id` MUST equal this directory's name AND start with the store id
# (`umbrel-wine`) — umbrelOS silently drops apps that fail
# `app.id.startsWith(store.id)`.
id: umbrel-wine-desktop
category: developer
name: Wine
# umbrelOS decides whether to offer an update by comparing ONLY this version.
# Bump it in the same commit as (or after) the new image digest in
# docker-compose.yml, never before: a device that polls the store in between
# installs the old image under the new version and is never offered it again.
version: "0.2.3"
tagline: Run Windows programs in your browser
description: >-
  REQUIRES umbrelOS 2.0 AND OPENS OVER HTTPS. The desktop is streamed as video
  that browsers only decode on secure pages, so Wine opens on the https address
  of your Umbrel. The first visit shows a browser certificate warning unless you
  trust the "Umbrel Local HTTPS CA" (Settings → Advanced settings → Network →
  HTTPS access).


  Upload Windows .exe files and run them with Wine on your Umbrel. The Windows
  desktop streams to your browser, and your keyboard and mouse control it. Files
  are uploaded into drives: each drive is a separate Windows environment with its
  own C: drive, registry and installed programs. A `main` drive exists by
  default; create more for other tasks, and reset or delete them at any time.


  Programs that need DLLs or data files next to them can be uploaded as a whole
  folder; each .exe runs from its own folder. The built-in file browser shows a
  drive's files and its C: drive, and opens settings files (.ini, .cfg, registry
  and other text files) in an editor.


  On an Umbrel Home, programs draw with the built-in graphics chip and the
  desktop is streamed with its hardware video encoder, which keeps motion
  smooth and leaves the CPU free for the programs themselves.


  On a Raspberry Pi, x86 programs are emulated with box64. They run much slower
  than on a PC, 3D-accelerated games will not work, and Raspberry Pi 5 support is
  experimental.


  Tailscale addresses are not covered by the Umbrel certificate, so the video
  will not decode when you open the app through Tailscale.
developer: CooperWaNg-py
website: https://github.com/CooperWaNg-py/umbrel-wine
dependencies: []
# umbrelOS mounts /dev/dri (and the NVIDIA runtime, if present) only when the
# host has a GPU. x86 hosts render and encode on it; arm64 opts out at startup
# (init-umbrel-wine), since the Pi's GPU has no video encoder.
permissions:
  - GPU
repo: https://github.com/CooperWaNg-py/umbrel-wine
support: https://github.com/CooperWaNg-py/umbrel-wine/issues
port: 4190
requiresHttps: true
# Community stores use `icon` and `gallery` verbatim; the default fallback
# (getumbrel.github.io/umbrel-apps-gallery/<id>/...) 404s for custom repos, so
# both MUST be absolute URLs.
# Assets live in this repo under assets/; raw.githubusercontent serves them.
icon: https://raw.githubusercontent.com/CooperWaNg-py/umbrel-wine/main/assets/icon.svg
gallery:
  - https://raw.githubusercontent.com/CooperWaNg-py/umbrel-wine/main/assets/gallery/1.jpg
  - https://raw.githubusercontent.com/CooperWaNg-py/umbrel-wine/main/assets/gallery/2.jpg
path: ""
# Left out of Umbrel backups: program logs and the desktop session's caches and
# runtime files, all regenerated. Paths are relative to the app directory
# (`data` is ${APP_DATA_DIR}/data, mounted at /config); drives are backed up.
backupIgnore:
  - data/logs
  - data/.cache
  - data/.XDG
submitter: CooperWaNg-py
submission: https://github.com/CooperWaNg-py/umbrel-wine
releaseNotes: >-
  Smoother, faster desktop streaming.

  On an Umbrel Home, Wine now uses the built-in graphics chip: programs draw
  with hardware OpenGL and the desktop is encoded by the hardware video
  encoder, so motion is smoother and the CPU is left for the programs. The
  app asks for GPU access for this; on a Raspberry Pi nothing changes.

  On high-resolution screens (Retina laptops, phones) the desktop is now
  streamed at the browser's normal resolution instead of 2-4x as many pixels,
  which raises the frame rate on every device and makes Windows programs a
  readable size. For the sharpest text, turn HiDPI back on in the Selkies
  sidebar (the tab on the left edge of the desktop).

  The encoder menu in that sidebar also offers striped H.264, which uses
  every CPU core and only re-encodes the parts of the screen that changed.
  Try it on a Raspberry Pi.
